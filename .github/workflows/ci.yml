name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: Unit + paper-finding tests + reproduce (CPU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install jax-es-hyperneat + TensorNEAT
        run: |
          python -m pip install --upgrade pip
          # Pin the JAX stack to the versions the published results were produced on.
          pip install "jax==0.6.1" "jaxlib==0.6.1" "numpy<2"
          pip install -e .
          pip install -e third_party/tensorneat
          pip install pytest

      - name: Smoke test (JAX-ESHN evolution on XOR)
        env:
          JAX_PLATFORMS: cpu
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: python jax_es_hyperneat/tests/test_smoke.py

      - name: Fast test suite (unit + frozen-data paper findings + isolation + reproduction)
        env:
          JAX_PLATFORMS: cpu
          TF_CPP_MIN_LOG_LEVEL: "3"
        run: pytest jax_es_hyperneat/tests -m "not slow" -q --tb=short

      - name: Reproduce the paper from committed data (no GPU, no evolution)
        # Redundant with test_reproduction.py, kept for visible PASS/FAIL output in the CI log.
        run: |
          cd papers/es-hyperneat-quadtree-problem
          python scripts/runners/verify_results.py
          python scripts/runners/verify_scaling_tables.py
          python scripts/analysis/analyze_hshg_results.py | tail -3
